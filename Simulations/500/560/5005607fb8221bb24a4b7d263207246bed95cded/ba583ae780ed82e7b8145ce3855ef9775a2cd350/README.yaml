bioschema_properties:
  name: Simulation Of A Pops Membrane With Potassium Counterions
  description: 'Simulations of a POPS membrane with potassium counterions. The systems contain 35 waters per lipid, and potassium counter ions for the anionic PS. The lipid model by Maciejewski and Rog [1,2,3] was used. Topologies (.itp) were obtained from [3] and the OPPS chains were reversed (the fixed itp is included in the upload) to create POPS, and the starting structure is taken from DOI: 10.5281/zenodo.1283335. TIP3P water was used, and the ions were modelled using default OPLS ion parameters. The simulation is 200 ns long. Simulation parameters are given in the md.mdp file. Simulations were performed with Gromacs 2016.3 [4]. The trajectory (.xtc), energy file (.edr), checkpoint file (.cpt), run input file (.tpr), index file (.ndx), topology file (.top), and the final structure (gro) are provided. [1] Maciejewski et al., J. Phys Chem. B 118, 2014, pp. 4571–4581, DOI: 10.1021/jp5016627 [2] Kulig et al., Data in Brief 5, 2015, pp. 333–336, DOI: 10.1016/j.dib.2015.09.013 [3] Rog et al., Data in Brief 7, 2016, pp. 1171–1174, DOI: 10.1016/j.dib.2016.03.067 [4] Abraham et al., SoftwareX 1–2, 2015, pp. 19–25, DOI: 10.1016/j.softx.2015.06.001'
