  name: SLIPID POPC-POPG 7:3 Bilayer Simulation (Last 100 ns, 310 K )
  alternateName: 150POPG_350POPC_25000SOL_150SOD_310K
  description: Simulation of a POPC-POPG 7:3 bilalyer of 500 lipids (150 POPG lipids and 350 POPG lipids, 250 per leaflet) is simulated for 500 ns using Gromacs v2018.3 in water solution with Na+ counterions. The SLPID model is employed for lipids with TIP3P Water Model. Trajectory (.xtc) is for the last 100 ns of a simulation of 500 ns with data saved every 10 ps. Additionally, the topology (.top) , simulation parameter file (.mdp), index file (.ndx), portable binary run input file (.tpr) and the energy output file (.edr) are provided.
