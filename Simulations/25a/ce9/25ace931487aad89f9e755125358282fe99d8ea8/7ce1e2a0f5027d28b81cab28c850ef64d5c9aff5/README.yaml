  description: 'The last 350ns from a 400ns MD simulation trajectory with Amber lipid 17 force field. POPC-POPG 80:20 (350 POPC, 88 POPG) with Na+ counterions. The starting structure and lipid 17 parameters from here: https://zenodo.org/record/2585523#.Xbf0FC17FBx. The starting structure was generated by removing the appropriate number of POPG lipids to get 80:20 ratio. Dihedral types are corrected to type 9 as discussed here: https://github.com/NMRLipids/NMRlipidsIVPEandPG/issues/12'
