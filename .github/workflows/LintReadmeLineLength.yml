name: LintReadmeLineLength

# Flags README.yaml lines longer than 100 characters and suggests the fold that
# fixes them. Advisory only: the job never fails on what it finds.
#
# pull_request_target, like AutocompleteExpSimMetadata, so the suggestions can be
# posted on pull requests from forks too. That runs with a write token, so
# nothing from the pull request is executed: its README files are only read, the
# yamllint configuration is written from this file rather than taken from the
# checkout, and the fold script comes from FAIRMD_lipids main.

on:
  pull_request_target:
    paths:
      - 'Simulations/**/README.yaml'
      - 'experiments/**/README.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  line-length:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BilayerData
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Checkout Databank
        uses: actions/checkout@v7
        with:
          repository: NMRlipids/FAIRMD_lipids
          ref: main
          path: Databank
          persist-credentials: false

      - name: Install yamllint and PyYAML
        run: pip install yamllint PyYAML

      - name: Install the gh cli
        uses: ksivamuthu/actions-setup-gh-cli@v3
        with:
          version: 2.83.0

      - name: Find changed README.yaml files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed_files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^(Simulations|experiments)/.+/README\.yaml$' || true)
          {
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$changed_files"

      - name: Set up reviewdog
        if: steps.files.outputs.changed_files != ''
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.2

      # Only the line-length rule: yamllint's defaults (document-start, truthy,
      # indentation, ...) would flag most of the databank. A value that has no
      # space in it cannot be folded, so `key: <one long word>` is allowed.
      # filter-mode=added keeps it to the lines this pull request writes, not the
      # ones already in the file.
      - name: Highlight lines over 100 characters
        if: steps.files.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/yamllint.yaml" <<'EOF'
          rules:
            line-length:
              max: 100
              allow-non-breakable-inline-mappings: true
          EOF
          mapfile -t files <<< "$CHANGED_FILES"
          yamllint -f parsable -c "$RUNNER_TEMP/yamllint.yaml" "${files[@]}" \
            | reviewdog \
                -name=line-length \
                -efm='%f:%l:%c: [%t%*[a-z]] %m' \
                -reporter=github-pr-review \
                -filter-mode=added \
                -fail-level=none \
                -level=warning \
                -tee

      # Same pattern as the suggestion step in AutocompleteExpSimMetadata: run the
      # fixer, hand its diff to reviewdog, and restore the pull request's files
      # first so the suggestions are anchored on them. The fixer only replaces
      # lines, never appends, so reanchor_eof_hunks.py is not needed here.
      - name: Suggest folds on PR
        if: steps.files.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_FILES"
          echo "::group::fold_long_yaml_lines.py"
          python Databank/developer/fold_long_yaml_lines.py "${files[@]}"
          echo "::endgroup::"
          git diff > "$RUNNER_TEMP/fold.diff"
          git stash -u
          reviewdog \
            -name=fold-long-lines \
            -f=diff \
            -f.diff.strip=1 \
            -reporter=github-pr-review \
            -filter-mode=diff_context \
            -fail-level=none \
            -level=warning \
            -tee \
            < "$RUNNER_TEMP/fold.diff"
          git stash drop || true
