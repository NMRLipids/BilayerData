name: "Check Molecular Metadata"

on:
  pull_request:
    paths:
      - 'Molecules/membrane/*/metadata.yaml'
      - 'Molecules/solution/*/metadata.yaml'

jobs:
  validate:
    runs-on: ubuntu-26.04
    env:
      FMDL_DATA_PATH: ${{ github.workspace }}/BilayerData

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Checkout BilayerData
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: BilayerData
          
      - name: Checkout Databank
        uses: actions/checkout@v7
        with:
          repository: NMRlipids/FAIRMD_lipids
          ref: v1.7.0
          path: Databank
          
      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema==0.34.1

      - name: Validate metadata.yaml files
        working-directory: BilayerData
        run: |
          for file in Molecules/membrane/*/metadata.yaml Molecules/solution/*/metadata.yaml; do
            if [ -f "$file" ]; then
              check-jsonschema --schemafile ../Databank/src/fairmd/lipids/schema_validation/schema/molecule_schema.json "$file"
            fi
          done
