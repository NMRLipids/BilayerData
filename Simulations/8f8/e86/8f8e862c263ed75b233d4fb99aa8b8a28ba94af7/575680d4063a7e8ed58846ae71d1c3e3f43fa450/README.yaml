bioschema_properties:
  name: Berger Popc/Dope (50:50 Ratio) Md Simulation (300 K - 300Ns - 1 Bar)
  description: Berger POPC/DOPE (50:50 ratio) bilayer simulation (300 K, with 128 POPC and 128 DOPE lipids fully hydrated with 40 water molecules per lipid). The trajectory contains the whole simulation from 0 to 300 ns skipped every 100 ps and centered on the P atoms. No ions were added as there is no global net charge in the system. This bilayer was used to calculate the order parameter and the area per lipid for the NMRlipids IV project (on the time window 100-300 ns). It should be noted that for this specific simulation, using PE lipids, the Berger forcefield was modified to add a repulsive potential onto the ethanolamine hydrogens.
