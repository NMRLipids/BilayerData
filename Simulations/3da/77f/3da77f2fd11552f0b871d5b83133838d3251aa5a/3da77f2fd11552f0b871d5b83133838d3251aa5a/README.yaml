bioschema_properties:
  name: Pure POPE membrane simulations with the CHARMM-Drude force field (OpenMM 7.5.0)
  alternateName: 72POPE_5040SOL_303K
  description: 'MD simulation data of a pure POPE membrane with the CHARMM-Drude force field generated with the OpenMM 7.5.0 simulation engine. All the input parameters are available in the *inp file. The initial structures have been obtained from CHARMM-GUI. Total simulation duration is 300 ns (100 ns x 3, continuing from the last frame, combined with the mdconvert). First 50 ns is discarded as equilibration. This data set contains 300 ns data with 3000 frames (saving frequency is 100 ps). In total, 72 POPC lipids in each leaflet (144 in total), 5040 SWM4-NPD water molecules. It has been discovered that (https://github.com/NMRLipids/Databank/issues/2#issuecomment-1357871243) the previously uploaded trajectory did not have the correct timestamp: the timestep between two consecutive simulation frames was not correctly embedded into the trajectory information. Therefore, with the latest version we are uploading the "unwrapped_all_fixed_dt.xtc" which has the correct timestamp. The frame saving frequency in this trajectory is 100 ps. This new update should not invalidate any previous calculations that did not explicitly read the timestamp information from the trajectory. This simulation consists of 3 sub-trajectories, each of which starts from the last frame of the previous one. These trajectories (originally in dcd format) were concatenated and saved in xtc format with MDAnalysis.'
