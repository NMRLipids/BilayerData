bioschema_properties:
  name: Simulations of DLPC, DOPC, and DEPC membranes
  description: Simulations of three different lipid bilayers using the CHARMM36 lipid model. The bilayers were built using CHARMM-GUI and simulated for 500 ns using Gromacs 2019. The systems contain 200 lipids (DLPC, DOPC, or DEPC), 50 lipids per water, and 130 mM NaCl. For each simulation, the run input file (tpr), topology (top), index (ndx), trajectory (xtc), log file (log), energy file (edr), continue point (cpt), and the final structure (gro) are given. The topology refers to the Gromacs-compatible CHARMM36 force field, available at http://mackerell.umaryland.edu/charmm_ff.shtml#gromacs and to other itp files provided in this upload. The simulation parameters are given in the md.mdp file.
