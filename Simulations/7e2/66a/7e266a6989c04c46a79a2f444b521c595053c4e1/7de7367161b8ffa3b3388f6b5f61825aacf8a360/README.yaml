  name: Berger Pops Simulations (Versions 1 And 2) 298 K 1.0 Nm Cut-Off
  alternateName: POPS_298K_Berger
  description: Berger POPS simulations (298 K, starting structure from the CHARMM-GUI with the appropriate hydrogen atoms removed) performed with 1.0 nm cut-offs and no long range dispersion correction. Two different simulations generated with different starting velocities are provided (the files are named v1 and v2 for these different simulations). The trajectories contain only the data from 400-500 ns of the simulations (as per the analysis provided on the nmrlipids blog) and additionally they have been processed with trjconv -skip 10 to keep the upload small.
