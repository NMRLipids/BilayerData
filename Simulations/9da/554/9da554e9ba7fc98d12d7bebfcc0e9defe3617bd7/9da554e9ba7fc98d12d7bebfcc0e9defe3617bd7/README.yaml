bioschema_properties:
  name: NAMD Trajectory of a DLiPC (di18:2PC) bilayer
  alternateName: DLIPC simulation
  description: All-atom DLiPC (1,2-dilinoleoyl-sn-glycero-3-phosphocholine) bilayer simulated in NPT ensemble with NAMD and the CHARMM36 force field from Doktorova et al. 2017 Phys. Chem. Chem. Phys. article (DOI 10.1039/c7cp01921a). The trajectory represents the last 245 ns used for analysis where the area per lipid is equilibrated (the file has 12250 frames output every 20 ps). The bilayer has 200 lipids total (100 lipids per leaflet) and is hydrated with 45 waters/lipid. The simulation was done at 25C (298.15K) and the trajectory is centered on the bilayer midplane.
