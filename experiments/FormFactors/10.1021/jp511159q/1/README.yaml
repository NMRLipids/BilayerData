  POPE: Avanti Polar Lipids (Alabaster, AL), used as received
  H2O: 18 MΩ·cm Millipore water
SAMPLE_PROTOCOL: >
  Lyophilized POPE powder was mixed with 18 MΩ·cm H2O (Millipore) at a concentration not exceeding
  40-50 mg/mL, followed by temperature cycling through the main phase transition until a uniform lipid
  dispersion was obtained. Unilamellar vesicles were prepared above the main phase transition with an
  Avanti mini-extruder, extruding through a 500-Å pore diameter polycarbonate filter (~33 total passes),
  resulting in ~600-Å diameter ULVs. The final ULV lipid concentration was ~20 mg/mL in 100% H2O.
