  name: SLIPID POPG-POPE 3:1 Bilayer Simulation (Last 100 ns, 310 K )
  alternateName: 374POPG_126POPE_25000SOL_374SOD_310K
  description: Simulation of a POPG-POPE 3:1 bilalyer of 500 lipids (150 POPG lipids and 350 POPG lipids, 250 per leaflet) is simulated for 500 ns using Gromacs v2018.3 in water solution with Na+ counterions. The SLPID model is employed for lipids with TIP3P Water Model. Trajectory (.xtc) is for the last 100 ns of a simulation of 500 ns with data saved every 10 ps. Additionally, the topology (.top) , simulation parameter file (.mdp), index file (.ndx), portable binary run input file (.tpr) and the energy output file (.edr) are provided.
