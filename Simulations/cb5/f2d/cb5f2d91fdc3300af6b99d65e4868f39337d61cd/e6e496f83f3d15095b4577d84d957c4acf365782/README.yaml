  name: Charmm36-Ua Dops Simulations (Versions 1 And 2) 303 K 1.0 Nm Lj Switching
  description: CHARMM36-UA DOPS simulations (303 K, starting structure from the CHARMM-GUI with appropriate hydrogen atoms removed) performed with a 1.0 nm point at which to switch off the van der Waals interactions. Two different simulations generated with different starting velocities are provided (the files are named v1 and v2 for these different simulations). The trajectories contain only the data from 400-500 ns of the simulations (as per the analysis provided on the nmrlipids blog) and additionally they have been processed with trjconv -skip 10 to keep the upload small.
