# Bioschemas properties inherited by every NMR order-parameter experiment.
#
# The `bioschema_properties` block of a README.yaml below this folder holds only
# what is specific to that record; its complete block is this file with the
# record's own block applied on top. No other bioschema_properties.yaml is read.
# The rules are in FAIRMD_lipids, src/fairmd/lipids/bioschema_inheritance.py.
#
# A record's own `measurementTechnique` adds the CHMO term its NMR METHOD maps
# onto, and the method and instrument as text; the EDAM topic below is what every
# one of them shares. State here only what is true of every record by definition:
# a record cannot remove an inherited list item.
#
# `license` is the licence of the data this repository distributes, per its own
# LICENSE file. An experiment record digitises values out of a paper: the paper
# carries the publisher's copyright, while the digitised values are distributed
# under CC-BY-4.0. Those are different facts, so `license` states the dataset
# licence and a record's own `articleLicense` keeps whatever the registry said
# about the publication. `license` is inherited whole: a record stating its own
# replaces this one entirely rather than merging with it.
license:
  spdx: CC-BY-4.0
  name: Creative Commons Attribution 4.0 International
  url: https://spdx.org/licenses/CC-BY-4.0.html
  sameAs: https://creativecommons.org/licenses/by/4.0/
keywords:
- '@type': DefinedTerm
  name: NMR
  termCode: topic_0593
  inDefinedTermSet: http://edamontology.org
  url: http://edamontology.org/topic_0593
- '@type': DefinedTerm
  name: Membrane and lipoproteins
  termCode: topic_0820
  inDefinedTermSet: http://edamontology.org
  url: http://edamontology.org/topic_0820
- '@type': DefinedTerm
  name: Biophysics
  termCode: topic_3306
  inDefinedTermSet: http://edamontology.org
  url: http://edamontology.org/topic_3306
measurementTechnique:
- '@type': DefinedTerm
  name: NMR
  termCode: topic_0593
  inDefinedTermSet: http://edamontology.org
  url: http://edamontology.org/topic_0593
variableMeasured:
- '@type': PropertyValue
  name: C-H bond order parameter
  unitCode: http://purl.obolibrary.org/obo/UO_0000186
  unitText: dimensionless
