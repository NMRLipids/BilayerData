bioschema_properties:
  name: Pure POPC Membrane with 450mM NaCl simulations using Drude Polarizable Force Field and OpenMM
  description: '500 ns MD simulation of pure POPC membrane using Charmm-Drude polarizable force field. The system contains 128 POPC lipids, 51 NaCl, and 6400 SWM4 water molecules. The simulation have been performed using OpenMM 7.4.1 Before running the Drude simulation, the system has been equilibriated using Charmm36 force field for 200 ns. The last frame of that simulation was used to generate Drude polarizable model. The first 100 ns of the Drude simulation has been discarded from this dataset. wrapped.dcd has a frame saving frequency of 100 ps. It has been discovered that (https://github.com/NMRLipids/Databank/issues/2#issuecomment-1357871243) the wrapped_full.dcd trajectory did not have the correct timestamp: the timestep between two consecutive simulation frames was not correctly embedded into the trajectory information. Therefore, with the latest version we are uploading the "wrapped_full_fixed_dt.xtc" which has the correct timestamp. The frame saving frequency in this trajectory is 10 ps. This new update should not invalidate any previous calculations that did not explicitly read the timestamp information from the trajectory. This simulation consists of 5 sub-trajectories, each of which starts from the last frame of the previous one and runs for 100 ns. These trajectories (originally in dcd format) were concatenated and saved in xtc format with MDAnalysis.'
