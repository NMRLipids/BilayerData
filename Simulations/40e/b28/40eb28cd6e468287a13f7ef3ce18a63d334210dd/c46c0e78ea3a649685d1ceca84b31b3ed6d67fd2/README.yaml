bioschema_properties:
  name: Simulations of POPC, SOPC, DOPC, and OMPC bilayers at three different sizes
  alternateName: DOPC_M
  description: 'Simulations of lipid bilayers with the CHARMM36 force field and TIP3P water. Three system sizes are used: small ("s", 64 lipids), medium ("m", 256 lipids), and large ("l", 1024 lipids). All simulations are 1 µs long. The simulations are performed using GROMACS, and for each system the following are provided: index file (ndx) topology file (top) run input file (tpr) energy file (edr) trajectory file (xtc) checkpoint file (cpt) final structure (gro) The simulation parameter file (mdp) is common for all simulations. The molecular topologies (top) are included in TOP.tar. The CHARMM36 force field is obtained from http://mackerell.umaryland.edu/charmm_ff.shtml'
