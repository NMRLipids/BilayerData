bioschema_properties:
  name: Simulations Of Large Popc Bilayers Using The Charmm36 Force Field.
  description: 'An earlier simulation (DOI:10.5281/zenodo.159759) of a POPC bilayer consisting of 200 lipids (100 per leaflet) is extended to 4 and 9 times larger (800 and 1800 lipids) and simulated for 100 ns using Gromacs v5.1.x [1]. The Charmm36 model [2] is employed for lipids and the Charmm-compatible variant of the tip3p model for water. The Charmm36 force field parameters were obtained from CHARMM-GUI [3] at http://www.charmm-gui.org –––––––––––––––––––––––––––––––––––––––––––––––––––––– The files are in GROMACS format. The number in the file name corresponds to how many times larger the system is compared to that in (DOI:10.5281/zenodo.159759), either 4 (2x2) or 9 (3x3). Trajectories (.xtc) is 100 ns long with data saved every 100 ps. Additionally, the topology (.top), binary run input file for GROMACS v. 5.0–> (.tpr), the continue point file (.cpt), and the energy output file (.edr) are provided. The provided simulation paremeter file (.mdp) is common for both simulations. –––––––––––––––––––––––––––––––––––––––––––––––––––––– [1] GROMACS: High performance molecular simulations through multi-level parallelism from laptops to supercomputers. Mark J. Abraham, Teemu Murtola, Roland Schulz, Szilárd Páll, Jeremy C. Smith, Berk Hess, and Erik Lindahl. SoftwareX 2015 1–2, 19–25, DOI: 10.1016/j.softx.2015.06.001 [2] Update of the CHARMM All-Atom Additive Force Field for Lipids: Validation on Six Lipid Types. Jeffery B. Klauda, Richard M. Venable, J. Alfredo Freites, Joseph W. O’Connor, Douglas J. Tobias, Carlos Mondragon-Ramirez, Igor Vorobyov, Alexander D. MacKerell, Jr., and Richard W. Pastor. The Journal of Physical Chemistry B 2010 114 (23), 7830-7843, DOI: 10.1021/jp101759q [3] CHARMM-GUI Input Generator for NAMD, GROMACS, AMBER, OpenMM, and CHARMM/OpenMM Simulations Using the CHARMM36 Additive Force Field. Jumin Lee, Xi Cheng, Jason M. Swails, Min Sun Yeom, Peter K. Eastman, Justin A. Lemkul, Shuai Wei, Joshua Buckner, Jong Cheol Jeong, Yifei Qi, Sunhwan Jo, Vijay S. Pande, David A. Case, Charles L. Brooks, III, Alexander D. MacKerell, Jr., Jeffery B. Klauda, and Wonpil Im. Journal of Chemical Theory and Computation 2016 12 (1), 405-413, DOI: 10.1021/acs.jctc.5b00935'
