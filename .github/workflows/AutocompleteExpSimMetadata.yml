name: AutocompleteExpSimMetadata

on:
  pull_request_target:
    paths:
      - 'Simulations/**/README.yaml'
      - 'experiments/**/README.yaml'

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  add-expsim-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BilayerData
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Clone Databank and install
        run: |
          git clone --depth 1 https://github.com/NMRlipids/FAIRMD_lipids.git "$RUNNER_TEMP/Databank"
          pip install "$RUNNER_TEMP/Databank"

      - name: Install the gh cli
        uses: ksivamuthu/actions-setup-gh-cli@v3
        with:
          version: 2.83.0

      - name: Find changed README.yaml files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed_files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^(Simulations|experiments)/.+/README\.yaml$' || true)
          {
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$changed_files"

      # Many simulations share a Zenodo deposition -- roughly 480 distinct DOIs
      # across 900 records -- so a warm cache turns most runs into no network at
      # all, and keeps the databank polite towards DataCite and CrossRef.
      - name: Restore API response cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.cache/bioschema
          key: bioschema-${{ hashFiles('Simulations/**/README.yaml', 'experiments/**/README.yaml') }}
          restore-keys: bioschema-

      - name: Run autocomplete_expsim_metadata.py and create suggestions
        if: steps.files.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_FILES"
          echo "::group::autocomplete_expsim_metadata.py"
          python "$RUNNER_TEMP/Databank/developer/autocomplete_expsim_metadata.py" "${files[@]}"
          echo "::endgroup::"

      - name: Suggest changes on PR
        if: steps.files.outputs.changed_files != ''
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: expsimmetadata
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: none         # post suggestions without failing the job
          reviewdog_flags: -tee    # echo reviewdog's stdout/stderr to the log
