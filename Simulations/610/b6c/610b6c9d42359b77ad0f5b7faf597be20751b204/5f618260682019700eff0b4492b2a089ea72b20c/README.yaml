  name: Charmm36 Pops/Popc Simulations (Versions 1 And 2) 298 K 1.0 Nm Lj Switching With Na Ions
  alternateName: 110POPC_22POPS_22SOD_4620SOL_298K_v2
  description: CHARMM36 mixed POPS and POPC bilayer simulations (298 K, starting structure from the CHARMM-GUI with 22 POPS and 110 POPC lipids) performed with a 1.0 nm point at which to switch off the van der Waals interactions. Two different simulations generated with different starting velocities are provided (the files are named v1 and v2 for these different simulations). The trajectories contain only the data from 400-500 ns of the simulations (as per the analysis provided on the nmrlipids blog) and additionally they have been processed with trjconv -skip 10 to keep the upload small. These simulations were performed with Na ions used to neutralise the system.
