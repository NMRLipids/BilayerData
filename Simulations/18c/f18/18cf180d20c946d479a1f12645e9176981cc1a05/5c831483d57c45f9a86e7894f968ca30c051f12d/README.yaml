bioschema_properties:
  name: Gromos-Ckp Dops Simulations (Versions 1 And 2) 303 K With Gromos Nh3 Charges And Pme
  description: GROMOS-CKP DOPS simulations (303 K, starting structure from the CHARMM-GUI with the appropriate hydrogen atoms removed) performed with 1.4 nm cut-offs, PME and a long range dispersion correction. The charges for the NH3 part of the head group are taken from the standard GROMOS force field parameters. Two different simulations generated with different starting velocities are provided (the files are named v1 and v2 for these different simulations). The trajectories contain only the data from 400-500 ns of the simulations (as per the analysis provided on the nmrlipids blog) and additionally they have been processed with trjconv -skip 10 to keep the upload small.
