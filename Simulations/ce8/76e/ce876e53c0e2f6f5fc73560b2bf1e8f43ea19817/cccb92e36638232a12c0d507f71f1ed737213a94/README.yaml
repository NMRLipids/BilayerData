bioschema_properties:
  name: MD simulation trajectory and related files for DMPC lipid bilayer in full hydration at 303 K with Charmm6
  alternateName: DMPC
  description: A MD simulation of 1,2-dimyristoyl-sn-glycero-3-phosphocholine (DMPC) conducted as part of a bachelor's project. Simulation ran with Gromacs 2026.1, CHARMM36 force field (as obtained from CHARMM-GUI on 17.04.2026) in full hydration. T= 303.15K, 40 DMPC (20 per leaflet) molecules, 1360 TIP3 (Charmm) molecules. The uploaded 100 ns trajectory was saved every 10 ps. We recommend discarding the first 10 ns to guarantee equilibration, see the attached plot time_ApL.png. production.tpr used Gromacs 2026.1, while prod243.tpr used Gromacs 2024.3
