  description: Raw simulation trajectory data of pre-equiblirated DOG/SDPE bilayer and related files from all-atom molecular dynamics simulations. Simulations have been performed with GROMACS-2018.6 with Lipid17 force field and TIP3P water model. The trajectory is 0-2100 ns, and we have disregarded the first 100 ns in our analysis. The system in the trajectory consists of 12 DOG, 116 SDPE and 6400 water molecules. Temperature 310 K, pressure 1 bar.
