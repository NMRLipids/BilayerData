bioschema_properties:
  name: Berger Dope Simulations (Versions 1 And 2) 271 K - Larger Repulsive H
  description: Two Berger-based DOPE bilayer simulations performed using GROMACS 4.0.7 for 300 ns with different starting velocities. Simulations were performed with a 1.0 nm cut-off with PME for the Coulombic and a 1.0 nm cut-off for the van der Waals interactions with a dispersion correction. These simulations were performed at 303 K with a 128 lipid bilayer. The full trajectories are provided bar the initial 100 ns. The starting structure was converted from an equilibrated DOPC membrane simulated with the GROMOS-CKP force field. The DOPE parameters were constructed following the approach used by de Vries et al (https://pubs.acs.org/doi/abs/10.1021/jp0366926), but with a slightly larger repulsive potential included for the explicit hydrogen atoms (designed to increase the area per lipid).
