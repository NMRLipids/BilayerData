bioschema_properties:
  name: NAMD Trajectory of a Tetraoleoyl Cardiolipin Bilayer
  alternateName: TOCL NAMD
  description: All-atom TOCL (tetraoleoyl cardiolipin) bilayer simulated in NPT ensemble with NAMD and the CHARMM36 force field from Doktorova et al. 2017 Phys. Chem. Chem. Phys. article (DOI 10.1039/c7cp01921a). The trajectory represents the last 155 ns used for analysis where the area per lipid is equilibrated (the file has 7752 frames output every 20 ps). The bilayer has 100 lipids total (50 lipids per leaflet) and is hydrated with 60 waters/lipid and 140mM NaCl. The simulation was done at 30C (303.15K) and the trajectory is centered on the bilayer midplane.
