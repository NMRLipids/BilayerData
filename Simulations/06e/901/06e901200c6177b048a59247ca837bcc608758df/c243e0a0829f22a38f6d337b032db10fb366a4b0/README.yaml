bioschema_properties:
  name: MD simulation trajectory and related files for DPPC lipid bilayer in full hydration at 322 K
  description: A MD simulation of 1,2-dipalmitoyl-sn-glycero-3-phosphocholine (DPPC) conducted as part of a bachelor's project. Simulation ran with Gromacs 2026.1, CHARMM36 force field (as obtained from CHARMM-GUI on 17.04.2026) in full hydration. T= 322 K, 40 DPPC (20 per leaflet) molecules, 1645 TIP3P (Charmm) waters. The uploaded 100 ns trajectory was saved every 10 ps. We recommend discarding the first 20 ns to guarantee equilibration, see the attached plot time_ApL.png.
