  description: 'MD simulation of POPC bilayer with OPLS3e force field, 1000 mM CaCl 2 part 2 Dataset contains trajectories (_trj) for the last 500ns of the 1000ns trajectory, topology (-out.cms), and other files. For the ease of the upload, trajectory files (_trj) are divided to 100ns pieces and tarred (named desmond_md_cacl1000_x-xns.tar.gz) Dataset also contains Gromacs converted trajectories for the last 500 ns of 1000 ns, and are as 100 ns pieces for analysis since simulation did not equilibrate during 1000 ns. System: POPC bilayer in water Number of lipids: 200 (100/leaflet) Number of waters: 8880 Salt: CaCl 2 Concentration: 1000 mM Number of cations: 160 Simulation time: 1000 ns (in this dataset 500-1000ns) Simulation engine: Desmond 2019-4 Temperature: 300 K Related dataset: MD simulation of POPC bilayer with OPLS3e force field, 1000 mM CaCl 2 part 1'
