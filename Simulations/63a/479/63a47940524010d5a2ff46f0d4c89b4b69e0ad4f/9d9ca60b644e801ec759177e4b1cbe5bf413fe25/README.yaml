bioschema_properties:
  name: MacRog pure POPC MD simulation (300 K - 500ns - 1 bar)
  description: 'MacRog POPC pure bilayer simulation. Starting structure from CHARMM-GUI: the initial PDB file was modified to match MacRog nomenclature and atom order. Temperature was set to 300 K and pressure to 1 bar with 128 POPC lipids fully hydrated: 40 water molecules per lipid. The trajectory contains the whole simulation from 0 to 500 ns skipped every 100 ps and centered on the P atoms. No ions were added as there is no charge in the system. This bilayer was used to calculate the order parameter and the area per lipid for the NMRLipids project (on the time window 200-500 ns). The popc.itp file was obtained from the paper doi : 10.1016/j.dib.2016.03.067. Several corrections have been made to the original file (for more information, go check https://www.dsimb.inserm.fr/~fuchs/project_Samuli/POPC_POPE/report_results_comparison.pdf). We provide here the corrected itp file.'
