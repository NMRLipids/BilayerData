bioschema_properties:
  name: Gromos POPE Bilayer Simulation (Last 100 ns, 150 mM NaCl, 310 K )
  alternateName: 500POPE_25000SOL_50SOD_50CLA_310K
  description: Simulation of a POPE bilayer of 500 lipids (250 per leaflet) is simulated for 500 ns using Gromacs v5.1.2 in water solution with Na+ counterions and 150 mM of NaCl. The GROMOS-CKP model is employed for lipids and SCP Water Model . Trajectory (.xtc) is for the last 100 ns of a simulation of 500 ns with data saved every 10 ps. Additionally, the topology (.top, .itp), simulation parameter file (.mdp), index file (.ndx), portable binary run input file (.tpr) and the energy output file (.edr) are provided.
