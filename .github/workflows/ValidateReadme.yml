name: Validate Simulation Metadata 

on:
  pull_request:
    paths: 'Simulations/**/README.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  Check-Readme:
    runs-on: ubuntu-26.04
    env:
      FMDL_DATA_PATH: ${{ github.workspace }}/BilayerData

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout BilayerData
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: BilayerData
          persist-credentials: false

      - name: Install FAIRMD_lipids dependencies
        run: |
          python -m pip install 'fairmd-lipids==1.7.0'

      - name: Validate all README.yaml files 
        working-directory: BilayerData
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          mapfile -d '' -t files < <(find Simulations -name README.yaml -print0)
          out="$(
            python -m fairmd.lipids.schema_validation.validate_yaml \
              --schema readme \
              "${files[@]}" 2>&1
          )"
          status=$?

          errors=""

          while IFS= read -r line; do
            case "$line" in
              ERROR:*)
                echo "::error::$line"
                errors+="$line"$'\n'
                ;;
            esac
          done <<< "$out"

          echo "::group::Full output"
          echo $out
          echo "::endgroup::"

          [ -n "$errors" ] || errors="None"

          {
            echo "## README.yaml validation"
            echo
            echo "**Errors:**"
            echo
            echo '```text'
            printf '%s' "$errors"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
