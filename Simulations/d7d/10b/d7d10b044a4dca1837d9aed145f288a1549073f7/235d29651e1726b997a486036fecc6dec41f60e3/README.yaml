bioschema_properties:
  name: Simulations Of Na+ And Ca2+ Binding To Phospholipid Membranes
  description: 'Simulations of various bilayers together with ions. A DOPC bilayer in the liquid disordered phase (310 K) and a DPPC bilayer in the gel phase (293 K), both formed of 200 lipids, were simulated with the presence of either 130 mM of NaCl or 450 mM of CaCl_2. The Slipids model [1–3] is employed for lipids, tip3p model for water, the ion parameters by Smith and Dang for NaCl [4] and the ion parameters by Kohagen et al. for CaCl_2 [5]. Trajectories with NaCl are 200 ns long, while with CaCl_2 they were either 500 ns (DOPC) or 800 ns (DPPC) long. Additionally, a ternary mixture of DPPC, DOPC, and cholesterol was simulated with the presence of 150 mM or 1 M of NaCl [4] at 310 K. The membrane was pre-assembled to contain Ld/Lo coexistence with a well-defined boundary. The Lo side consisted of 205 DPPC and 52 cholesterol molecules, while the Ld side consisted of 166 DOPC molecules. Trajectories are 200 ns long. The Slipids force field parameters are available at http://www.fos.su.se/~sasha/SLipids/ and the ion parameters are available at https://bitbucket.org/hseara/ions/ –––––––––––––––––––––––––––––––––––––––––––––––––––––– The files are in GROMACS format. Trajectories (.xtc) are saved every 100 ps. Additionally, the final structure (.gro), topology (.top), index file (.ndx), energy output file (.edr), and binary run input files (for Gromacs 4.6->) (.tpr) are provided for each system. The common simulation parameter file except for the varying temperatures (md.mdp) is also provided. –––––––––––––––––––––––––––––––––––––––––––––––––––––– [1] Derivation and Systematic Validation of a Refined All-Atom Force Field for Phosphatidylcholine Lipids. Joakim P. M. Jämbeck and Alexander P. Lyubartsev, The Journal of Physical Chemistry B 2012 116 (10), 3164-3179, DOI: 10.1021/jp212503e [2] An Extension and Further Validation of an All-Atomistic Force Field for Biological Membranes. Joakim P. M. Jämbeck and Alexander P. Lyubartsev, Journal of Chemical Theory and Computation 2012 8 (8), 2938-2948, DOI: 10.1021/ct300342n [3] Another Piece of the Membrane Puzzle: Extending Slipids Further. Joakim P. M. Jämbeck and Alexander P. Lyubartsev, Journal of Chemical Theory and Computation 2013 9 (1), 774-784, DOI: 10.1021/ct300777p [4] Computer simulations of NaCl association in polarizable water. David E. Smith and Liem X. Dang, The Journal of Chemical Physics 1994 100, 3757-3766, DOI: 10.1063/1.466363 [5] Accurate Description of Calcium Solvation in Concentrated Aqueous Solutions. Miriam Kohagen, Philip E. Mason, and Pavel Jungwirth, The Journal of Physical Chemistry B 2014 118 (28), 7902-7909, DOI: 10.1021/jp5005693'
