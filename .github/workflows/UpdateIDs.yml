# Generate an unique ID for each simulation in the NMRlipids databank
#
# This workflow generates a pull request with the modification of the
# README files of conflictive systems.
#
# // initially written by Fabián Suárez-Lestón

name: UpdateIDs

permissions:
   contents: write
   pull-requests: write

on:
  push:
    branches: [ "main" ]
    paths: ['Simulations/**/README.yaml']
  workflow_dispatch:

jobs:
  UpdateIDs:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Prepare update branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code origin \
              'refs/heads/maintanance/update-id' >/dev/null 2>&1; then
            git fetch origin maintanance/update-id
            git checkout -B maintanance/update-id origin/maintanance/update-id
            git reset --hard origin/main
          else
            echo "Update branch does not exist yet; create-pull-request will create it."
          fi

      - name: Assign new IDs
        id: newids
        run: |
          . .github/workflows/CheckIDs.sh generate
        # The sh-script writes into GITHUB_OUTPUT inside itself

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        # Trigger the step only if there have been changes made to the IDs
        if: steps.newids.outputs.newids == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update simulation IDs
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: maintanance/update-id
          delete-branch: false
          title: Update IDs after commit ${{github.sha}}
          body: |
            Generated new IDs for duplicates or new systems at ${{ github.sha }}.
            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: |
            UpdateID
            AutoPR
            contribute:sim
          draft: false
