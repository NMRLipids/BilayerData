name: AutocompleteExpSimMetadata

on:
  pull_request_target:
    paths:
      - 'Simulations/**/README.yaml'
      - 'experiments/**/README.yaml'
      - 'Simulations/**/bioschema_properties.yaml'
      - 'experiments/**/bioschema_properties.yaml'

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  add-expsim-metadata:
    runs-on: ubuntu-26.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Checkout BilayerData
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Checkout Databank
        uses: actions/checkout@v7
        with:
          repository: NMRlipids/FAIRMD_lipids
          ref: v1.7.0
          path: Databank
          persist-credentials: false

      - name: Install Databank
        working-directory: Databank
        run: pip install .

      - name: Find changed README.yaml and bioschema_properties.yaml files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status != "removed") | .filename')
          changed_files=$(echo "$changed" \
            | grep -E '^(Simulations|experiments)/.+/README\.yaml$' || true)
          changed_templates=$(echo "$changed" \
            | grep -E '^(Simulations|experiments)(/.+)?/bioschema_properties\.yaml$' || true)
          {
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
            echo "changed_templates<<EOF"
            echo "$changed_templates"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$changed_files"
          echo "Changed templates:"
          echo "$changed_templates"

      # Many simulations share a Zenodo deposition -- roughly 480 distinct DOIs
      # across 900 records -- so a warm cache turns most runs into no network at
      # all, and keeps the databank polite towards DataCite and CrossRef.
      - name: Restore API response cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.cache/bioschema
          key: bioschema-${{ hashFiles('Simulations/**/README.yaml', 'experiments/**/README.yaml') }}
          restore-keys: bioschema-

      # The script exits 1 when it refuses a record whose kind template is missing
      # or states no licence; it still enriches every other record. That status is
      # held back here and raised by the last step, so the suggestions for the
      # records it did enrich are posted first.
      #
      # Python also exits 1 on an uncaught exception, so status 1 alone does not
      # mean a refusal. It counts as one only when the run reached its summary
      # line and that line reports refused records; anything else is a crash and
      # fails this step at once, before any suggestion is posted.
      - name: Run autocomplete_expsim_metadata.py and create suggestions
        id: autocomplete
        if: steps.files.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_FILES"
          log="$RUNNER_TEMP/autocomplete.log"
          echo "::group::autocomplete_expsim_metadata.py"
          status=0
          python "Databank/developer/autocomplete_expsim_metadata.py" "${files[@]}" \
            > "$log" 2>&1 || status=$?
          cat "$log"
          echo "::endgroup::"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          summary=$(tail -n 1 "$log")
          if [ "$status" -eq 1 ] \
            && [[ "$summary" =~ ^[0-9]+\ of\ [0-9]+\ records\ .*refused\ for\ a\ missing\ or\ incomplete\ template$ ]]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::autocomplete_expsim_metadata.py failed (exit $status); see the log above"
            exit "$status"
          fi

      - name: Set up reviewdog
        if: steps.files.outputs.changed_files != ''
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.2

      # This is what reviewdog/action-suggester does, with one step inserted, so
      # it runs reviewdog directly rather than through the action.
      #
      # The autocomplete appends its block to the end of a README, and git
      # reports an append as a pure insertion -- `@@ -41,0 +42,74 @@`. reviewdog
      # anchors an inserted hunk at the line after the last unchanged one, which
      # for an append is one line past the end of the file; no review comment can
      # attach there, so the filter dropped every suggestion carrying the block
      # while this job still reported success. That is how PR #522 ended up with
      # a green check and no metadata.
      #
      # reanchor_eof_hunks.py rewrites that hunk into a replacement of the file's
      # last line, which is a line the pull request's diff contains. The
      # suggestion then reads as that line followed by the block and produces the
      # same file, byte for byte, that the script wrote.
      - name: Suggest changes on PR
        if: steps.files.outputs.changed_files != ''
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git diff > "$RUNNER_TEMP/autocomplete.diff"
          python Databank/developer/reanchor_eof_hunks.py \
            < "$RUNNER_TEMP/autocomplete.diff" \
            > "$RUNNER_TEMP/autocomplete.reanchored.diff"
          git stash -u
          reviewdog \
            -name=expsimmetadata \
            -f=diff \
            -f.diff.strip=1 \
            -reporter=github-pr-review \
            -filter-mode=diff_context \
            -fail-level=none \
            -level=warning \
            -tee \
            < "$RUNNER_TEMP/autocomplete.reanchored.diff"
          git stash drop || true

      # A bioschema_properties.yaml template states what every record below its
      # folder inherits, so a broken one is wrong for all of those records at
      # once. Templates are checked rather than enriched: the script validates
      # each against the bioschema block schema and rejects properties that
      # belong to one record, and an invalid template fails this job. It runs
      # last so that the README suggestions above are posted either way, and
      # always() runs it even when a README step above failed, so a broken
      # template is reported in the same run. It still needs the file list.
      - name: Check changed bioschema_properties.yaml templates
        if: >-
          always()
          && steps.files.outcome == 'success'
          && steps.files.outputs.changed_templates != ''
        env:
          CHANGED_TEMPLATES: ${{ steps.files.outputs.changed_templates }}
        run: |
          set -euo pipefail
          mapfile -t templates <<< "$CHANGED_TEMPLATES"
          python "Databank/developer/autocomplete_expsim_metadata.py" --check "${templates[@]}"

      - name: Fail on records refused for a missing or incomplete template
        if: always() && steps.autocomplete.outputs.refused == 'true'
        run: |
          echo "::error::autocomplete_expsim_metadata.py refused at least one record because its" \
               "kind's bioschema_properties.yaml is missing or states no license; see the" \
               "'Run autocomplete_expsim_metadata.py' step log"
          exit 1
